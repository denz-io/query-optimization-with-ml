services:
  db:
    image: postgres:16
    container_name: smartdemo-pg
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: smartdemo
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=64MB
      -c max_parallel_workers_per_gather=0
      -c track_io_timing=on
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: smartdemo-app
    container_name: smartdemo-app
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    environment:
      SMART_DSN: postgresql://postgres:demo@db:5432/smartdemo
      APARTMENT_ROWS: ${APARTMENT_ROWS:-3000000}
      BUILDING_ROWS: ${BUILDING_ROWS:-300000}
      LANDLORD_ROWS: ${LANDLORD_ROWS:-100000}
      DISTRICT_ROWS: ${DISTRICT_ROWS:-1000}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
